<section class="calendar-container">
  <div class="calendar">
    <div class="calendar-headline">
      <div class="calendar-headline-month">
        {{firstDayOfActiveMonth().monthShort}},
        {{firstDayOfActiveMonth().year}}
      </div>
      <div class="calendar-headline-controls">
        <span class="material-symbols-sharp calendar-headline-control" (click)="goToPreviousMonth()">
          arrow_left_alt
        </span>
        <div class="calendar-headline-control calendar-headline-control-today" (click)="goToToday()">Hoje</div>
        <span class="material-symbols-sharp calendar-headline-control" (click)="goToNextMonth()">
          arrow_right_alt
        </span>
      </div>
    </div>
    <div class="calendar-weeks-grid">
      @for (weekDay of weekDays(); track $index) {
      <div class="calendar-weeks-grid-cell">{{weekDay.toUpperCase()}}</div>
      }
    </div>
    <div class="calendar-grid">
      @for (dayOfMonth of daysOfMonth(); track $index) {
      <div
        [class]="{'calendar-grid-cell': true, 'calendar-grid-cell-active': activeDay()?.toISODate() === dayOfMonth.toISODate(), 'calendar-grid-cell-inactive': dayOfMonth.month !== firstDayOfActiveMonth().month}"
        (click)="activeDay.set(dayOfMonth)">
        <div
          [class]="{'calendar-grid-number-marked': dayOfMonth.day === today().day && dayOfMonth.month === today().month}">
          {{dayOfMonth.day}}</div>
      </div>
      }
    </div>
  </div>
</section>
