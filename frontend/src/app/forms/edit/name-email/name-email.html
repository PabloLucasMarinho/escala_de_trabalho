<form [formGroup]="form" (ngSubmit)="onSubmit()" class="edit-name-email">
  <h2>Editar Nome ou E-mail</h2>
  <fieldset>
    <div>
      <label for="name">Nome</label><br>
      <input type="text" name="name" id="name" autocomplete="name" placeholder="Digite seu nome" formControlName="name"
        [class]="nameIsInvalid ? 'invalid-input' : ''" />
    </div>

    <div>
      <label for="email">E-mail</label><br>
      <input type="email" name="email" id="email" autocomplete="email" placeholder="Digite seu e-mail"
        formControlName="email" [class]="emailIsInvalid ? 'invalid-input' : ''" />
    </div>

    <input class="button" type="submit" value="Salvar">
  </fieldset>
</form>

@if(nameIsInvalid || emailIsInvalid || errors().length > 0) {
<p class="messages">
  @if(nameIsInvalid) {
  <small>Nome inválido.</small>
  }

  @if(emailIsInvalid) {
  <small>E-mail inválido.</small>
  }

  @if(errors().length > 0) {
  @for (error of errors(); track error) {
  <small>{{error}}</small>
  }
  }
</p>
}
