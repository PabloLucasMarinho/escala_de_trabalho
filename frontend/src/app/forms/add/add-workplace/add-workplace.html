<form [formGroup]="form_workplace" (ngSubmit)="onSubmit()">
  <fieldset>
    <h2>Cadastrar Local de Trabalho</h2>
    <div>
      <label for="name">Nome</label><br>
      <input type="text" name="name" id="name" autocomplete="on" placeholder="Digite o nome do colaborador"
        formControlName="name" [class]="nameIsInvalid ? 'invalid-input' : ''" required />
    </div>

    @if(nameIsInvalid || errors().length > 0) {
    <p class="error">
      @if(nameIsInvalid) {
      <small>Nome inválido.</small>
      }

      @if(errors().length > 0) {
      @for (error of errors(); track error) {
      <small>{{error}}</small>
      }
      }
    </p>
    }
  </fieldset>
  <input class="small-button" type="submit" value="Salvar">
</form>
