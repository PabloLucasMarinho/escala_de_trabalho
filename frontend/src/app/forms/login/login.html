<section>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <h2>Seja bem vindo de volta!</h2>
    </div>

    <div class="input-container">
      <label for="email">E-mail</label>
      <div>
        <span class="material-symbols-rounded">
          alternate_email
        </span>
        <input type="email" name="email" id="email" autocomplete="email" placeholder="Digite seu e-mail"
          formControlName="email" [class]="emailIsInvalid ? 'invalid-input' : ''" required />
      </div>
      @if(emailIsInvalid) {
      <small>
        <span class="material-symbols-rounded">
          error
        </span>
        E-mail inválido
      </small>
      }
    </div>

    <div class="input-container">
      <label for="password">Senha</label>
      <div>
        <span class="material-symbols-rounded">
          lock
        </span>

        <input [type]="isShowingPassword() ? 'text' : 'password'" name="password" id="password"
          autocomplete="current-password" placeholder="Digite sua senha" formControlName="password"
          [class]="passwordIsInvalid ? 'invalid-input' : ''" required />
        <span (click)="showPassword()">Mostrar</span>
      </div>
      @if(passwordIsInvalid) {
      <small>
        <span class="material-symbols-rounded">
          error
        </span>
        Senha inválida
      </small>
      }
    </div>

    <div class="remember-me">
      <label for="keep-connected"><input type="checkbox" id="keep-connected">Lembrar de mim</label>

      <small>Esqueceu sua senha?</small>
    </div>

    @if(isFetching() && errors().length === 0) {
    <button LoadingButton class="button"></button>
    }@else{
    <input class="button" type="submit" value="Entrar">
    }

    <div class="or-line">
      <hr>
      <span>OU</span>
      <hr>
    </div>

    <div class="social-icons">
      <img src="google.png" alt="Ícone do Google">
      <img src="outlook.png" alt="Ícone do Outlook">
      <img src="github.png" alt="Ícone do Outlook">
    </div>
  </form>

  <small class="register-link">
    Não possui conta? <a routerLink="/register" class="click-here">Clique aqui</a>
  </small>
</section>
