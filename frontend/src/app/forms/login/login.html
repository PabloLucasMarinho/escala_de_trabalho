<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h1>Boas vindas de volta!</h1>
  <mat-form-field>
    <mat-label>E-mail</mat-label>
    <input matInput formControlName="email" (blur)="updateErrorMessage()" required />
    @if (loginForm.value.email) {
    <mat-error>{{errorMessage()}}</mat-error>
    }
  </mat-form-field>

  <mat-form-field>
    <mat-label>Senha</mat-label>
    <input matInput formControlName="password" [type]="hide() ? 'password' : 'text'" required />
    <button matIconButton matSuffix type="button" (click)="clickEvent($event)" [attr.aria-label]="'Ocultar senha'"
      [attr.aria-pressed]="hide()">
      <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
  <input type="submit" value="Entrar">
</form>
